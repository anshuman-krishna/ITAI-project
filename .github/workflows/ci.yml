name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm --filter @itai/web build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [packages/ml-core, apps/api, apps/worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        working-directory: ${{ matrix.package }}
        run: pip install -e ".[dev]"
      - name: lint
        working-directory: ${{ matrix.package }}
        run: ruff check .
