[project]
name = "itai-worker"
version = "0.1.0"
description = "async job worker for training, embeddings, and report generation"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "pydantic-settings>=2.6",
]

# ml-core is installed editable from the monorepo:
#   pip install -e ../../packages/ml-core

[project.optional-dependencies]
dev = ["ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
